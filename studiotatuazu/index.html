<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatuaże</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="preload" href="DancingScript-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

    <section id="sekcja-glowna">
        <aside>
            <header id="bloknaglowkowy1">
                <img src="logo.png" alt="salon">
            </header>

            <section id="blokboczny">
                <h3>Dodaj wzór</h3>
                <form>
                    <label for="nazwa-pliku">Wzór:</label>
                    <input type="text" id="nazwa-pliku" name="nazwa_pliku"><br>

                    <input type="file" id="wybor-pliku" name="plik_wzor" accept="image/png"><br>

                    <label for="lista-kolorow">Kolor: </label>
                    <select id="lista-kolorow" name="kolor">
                        <option value="czarny">Czarny</option>
                        <option value="czerwony">Czerwony</option>
                        <option value="zielony">Zielony</option>
                        <option value="niebieski">Niebieski</option>
                    </select><br>

                    <label for="cena-wzoru">Cena:</label>
                    <input type="number" id="cena-wzoru" name="cena" step="0.01"><br>

                    <button type="button" onclick="dodajwzor()">Dodaj Wzór</button>
                </form>
            </section>
        </aside> 

        <main>
            <header id="bloknaglowkowy2">
                <h1>Studio Tatuażu</h1>
            </header>
            <section id="bloksekcji">
                <h2>Galeria</h2>
                <img src="smok.png" alt="smok.png" class="miniatury">
                <img src="koliber.png" alt="koliber.png" class="miniatury">
            </section>
        </main>
    </section>

    <footer>
        <p>Autor strony: Oskar</p>
    </footer>


    <script>
        function dodajwzor() {

            let kolor = document.getElementById('lista-kolorow').value;
            let cena = document.getElementById('cena-wzoru').value;
            let polePliku = document.getElementById('wybor-pliku');

            let nazwaPliku = "";
            if (polePliku.files.length > 0) {
                nazwaPliku = polePliku.files[0].name;
            }


            alert(`Wzór: ${nazwaPliku}, kolor ${kolor} w cenie ${cena} zł`);
            

            let nowyobraz = document.createElement('img');

            nowyobraz.src = nazwaPliku;
            nowyobraz.alt = nazwaPliku;
            nowyobraz.className = 'miniatury';
            
            let sekcja = document.getElementById('bloksekcji');
            sekcja.appendChild(nowyobraz);


            }
    </script>
</body>
</html>
